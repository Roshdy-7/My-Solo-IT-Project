<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add-Course</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!--Header-->

    <div class="Header">
      <div class="Headerlogo">
        <img src="images/تنزيل.png" alt="logo" height="50px" />
      </div>

      <nav class="Headerlinks">
        <a href="index.html">Home</a>
        <a href="courses.html">My-Courses</a>
        <a href="add-course.html">Add-Course</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
    <main class="MIDsection-mycourses">
      <div class="MIDsection1-mycourses">
        <h1>Add New Courses</h1>
        <p>AFTER YOU FINISH TYPE SOME TEXTS</p>
      </div>
      <br />
      <br />
      <form class="course-form">
        <label for="course-name">Course Name</label>
        <input type="text" id="course-name" name="course-name" required />

        <label for="instructor">Instructor</label>
        <input type="text" id="instructor" name="instructor" required />

        <label for="credits">Credit Hours</label>
        <input
          type="number"
          id="credits"
          min="1"
          max="4"
          name="credits"
          value="1"
          required
        />

        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" rows="3"></textarea>

        <input type="submit" value="Add Course" class="submit-btn" />
      </form>

      <br />
      <br />
    </main>
  </body>
</html>
